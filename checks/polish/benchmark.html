<!doctype html><meta charset="utf-8"><title>Pineapple Siege benchmark</title><style>html,body{margin:0;background:#111}iframe{border:0;width:1920px;height:1080px}#status{position:fixed;top:4px;left:4px;background:#111b;color:white;font:12px monospace;z-index:9;pointer-events:none}</style><div id="status">Loading benchmark</div><iframe src="/#debug"></iframe><script>
const params=new URLSearchParams(location.search),duration=+(params.get('seconds')||600),browser=params.get('browser')||'unknown',frame=document.querySelector('iframe'),label=document.querySelector('#status');
const stress=params.get('stress')==='1'; const errors=[];let start,last=0,frames=[],samples=[],maxBodies=0,maxJobs=0,maxClouds=0,maxFragments=0,maxHeap=0,maxPhysics=0,maxWork=0,nukes=0,lastCooldown=0,timer,done=false;
function post(name,value){return fetch('/result/'+browser+'-'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(value)}).catch(e=>errors.push(String(e)))}
const ready=setInterval(()=>{const w=frame.contentWindow,g=w.lanternVale;if(!g?.state.ready)return;clearInterval(ready);if(browser==='safari'){const button=document.createElement('button');button.textContent='Start benchmark';button.style.cssText='position:fixed;top:40px;left:20px;z-index:100;padding:20px';document.body.append(button);button.onclick=()=>{button.remove();run(w,g)}}else run(w,g)},100);
async function run(w,g){
 w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));
 if(stress)g.send({type:'destructionSettings',value:{bodies:1,fragments:1,cosmetics:1,rubble:1,noCooldown:true,nukeScale:1}});
 for(const id of ['reduceEffects','reduceShake']){w.document.getElementById(id).checked=false;w.document.getElementById(id).dispatchEvent(new w.Event('change'));}
 g.setQuality('1080');g.send({type:'holdTime',hold:true});g.send({type:'nukeYield',value:'valley'});
 const mute=w.document.querySelector('#mute');mute.checked=true;mute.dispatchEvent(new w.Event('change'));
 frame.focus();g.enter();g.setPlane([1210,280,800],Math.PI/2,0);start=performance.now();
 w.requestAnimationFrame(function collect(t){if(done)return;const now=performance.now();if(last)frames.push({t:(now-start)/1000,ms:now-last});last=now;w.requestAnimationFrame(collect)});
 timer=setInterval(()=>{
 const s=g.state.snapshot;if(!s)return;const t=(performance.now()-start)/1000;
 const sites=[{p:g.world.castle},...g.world.sites.filter(s=>['hamlet','watermill','windmill','quarry','crossing','logging','watchtower','farm'].includes(s.kind))];
 const landmark=sites[t<90?0:1+Math.floor((t-90)/50)%(sites.length-1)],c=landmark.p,pos=s.plane.p;
 const d=Math.hypot(pos[0]-c[0],pos[2]-c[2]),angle=Math.atan2(pos[0]-c[0],pos[2]-c[2])+.8;
 const target=d>350?[c[0],c[1]+230,c[2]]:[c[0]+Math.sin(angle)*160,c[1]+230,c[2]+Math.cos(angle)*160];
 const dx=target[0]-pos[0],dz=target[2]-pos[2],yaw=Math.atan2(dx,dz),pitch=Math.atan2(target[1]-pos[1],Math.max(15,Math.hypot(dx,dz))),diff=Math.atan2(Math.sin(yaw-s.plane.yaw),Math.cos(yaw-s.plane.yaw));
 if(s.cooldowns.nuke>9.5&&lastCooldown<5)nukes++;lastCooldown=s.cooldowns.nuke;
 const weapon=stress?(Math.floor(t/10)%2?'cannon':'nuke'):(t>30&&s.cooldowns.nuke<.12?'nuke':'cannon');if(s.weapon!==weapon)g.send({type:'weapon',weapon});
 g.controls({x:Math.max(-1,Math.min(1,-diff*2)),y:Math.max(-1,Math.min(1,(pitch-s.plane.pitch)*3)),bank:0,throttle:0,boost:false,fire:stress||t>30});
 },50);
 const poll=setInterval(async()=>{
 const elapsed=(performance.now()-start)/1000,s=g.state.snapshot,r=g.state.render;
 maxBodies=Math.max(maxBodies,s.stats.bodies);maxJobs=Math.max(maxJobs,s.stats.pendingJobs);maxClouds=Math.max(maxClouds,r.clouds||0);maxFragments=Math.max(maxFragments,r.fragments||0);maxHeap=Math.max(maxHeap,w.performance.memory?.usedJSHeapSize||0);maxWork=Math.max(maxWork,s.stats.destructionMS);maxPhysics=Math.max(maxPhysics,s.stats.physicsMS);
 label.textContent=`${browser}: ${Math.round(elapsed)}/${duration}s | ${nukes} nukes | ${s.stats.removed} removed | ${r.fragments||0} flying chunks`;
 if(Math.floor(elapsed/30)>samples.length){const row={elapsed,stats:s.stats,render:r,position:s.plane.p,simTime:s.time,active:g.state.active,audio:g.state.audio,heap:w.performance.memory?.usedJSHeapSize};samples.push(row);post('progress.json',row)}
 if(!g.state.active){errors.push('Unexpected pause at '+elapsed);g.enter();}
 if(elapsed>=duration){clearInterval(poll);clearInterval(timer);done=true;g.pause();const save=await g.save();const summary=a=>{const v=a.map(x=>x.ms).sort((a,b)=>a-b);return {frames:v.length,medianMS:v[Math.floor(v.length*.5)],p95MS:v[Math.floor(v.length*.95)],p99MS:v[Math.floor(v.length*.99)],maxMS:Math.max(...v),over100MS:v.filter(x=>x>100).length}};
 window.report={browser,userAgent:w.navigator.userAgent,viewport:[1920,1080],durationSeconds:elapsed,normal:summary(frames.filter(x=>x.t>3&&x.t<30)),destruction:summary(frames.filter(x=>x.t>30)),maxBodies,maxJobs,maxClouds,maxFragments,maxHeap,maxPhysicsMS:maxPhysics,simulatedSeconds:s.time,stress,maxDestructionMS:maxWork,nukes,stats:s.stats,saveBytes:new Blob([JSON.stringify({...save,terrain:[]})]).size+save.terrain.byteLength,pendingSaved:save.pendingJobs.length,glError:g.renderer.getContext().getError(),samples,errors};await post('report.json',report);label.textContent='Benchmark complete';}
 },500);
}
</script>
