<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='27'%3E🍍%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Siege native performance benchmark</title>
    <style>
      body {
        margin: 0;
        background: #10191d;
        color: white;
        font: 14px system-ui;
      }
      canvas {
        width: 100vw;
        height: 100vh;
        display: block;
      }
      aside {
        position: fixed;
        left: 12px;
        top: 12px;
        max-width: 680px;
        padding: 12px;
        background: #10191deb;
        border-radius: 8px;
      }
      pre {
        max-height: 35vh;
        overflow: auto;
        font-size: 12px;
        white-space: pre-wrap;
      }
      button,
      select {
        font: inherit;
        padding: 6px;
        margin: 3px;
      }
      #report {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <aside>
      <strong>Native performance benchmark · isolated test save</strong>
      <div>Run in the foreground. Your active island is untouched.</div>
      <label
        >Cases
        <select id="case">
          <option value="-1">Complete matrix</option>
          <option value="-2">Projectile and distance matrix</option>
          <option value="0">Flight · 120</option>
          <option value="1">Nuke · 120</option>
          <option value="2">Laser · 120</option>
          <option value="3">Flight · 400</option>
          <option value="4">Nuke · 400</option>
          <option value="5">Laser · 400</option>
          <option value="6">Single nuke · saves enabled</option>
          <option value="7">Single nuke · saves disabled</option>
        </select></label
      ><button id="run" disabled>Run benchmark</button
      ><button id="normal-soak" disabled>15-minute normal certification</button
      ><button id="soak" disabled>15-minute stress soak</button
      ><button id="storage">Storage correctness</button
      ><button id="context">Context recovery check</button
      ><button id="export">Save local report</button
      ><button id="download">Download results</button
      ><button id="scene">Save scene image</button
      ><span id="status">Loading…</span>
      <div id="summary"></div>
      <details>
        <summary>Inspect scene</summary>
        <label>Seed <input id="seed" value="41729" size="12" /></label
        ><button id="load-seed">Load test seed</button
        ><label
          >View
          <select id="viewpoint">
            <option value="castle">Castle</option>
            <option value="castle-gate">Castle gate</option>
            <option value="castle-walls">Castle walls</option>
            <option value="castle-keep">Castle keep</option>
            <option value="castle-tower">Castle tower</option>
            <option value="aircraft">Aircraft</option>
            <option value="resident">Resident</option>
            <option value="monster">Pineapple monster</option>
            <option value="coast">Coast</option>
            <option value="river">River</option>
            <option value="river-bend">River bend</option>
            <option value="village">Village</option>
            <option value="farm">Farm</option>
            <option value="windmill">Windmill</option>
            <option value="watermill">Watermill</option>
            <option value="watchtower">Watchtower</option>
            <option value="logging">Logging camp</option>
            <option value="quarry">Quarry</option>
            <option value="harbor">Harbor</option>
            <option value="bridge">Bridge</option>
            <option value="crossing">Crossing</option>
            <option value="lighthouse">Lighthouse</option>
            <option value="coastal-ruin">Coastal ruins</option>
            <option value="road">Road surface</option>
            <option value="mountain">Mountain</option>
            <option value="pine">Pines</option>
            <option value="broadleaf">Broadleaf forest</option>
            <option value="riverside">Riverside forest</option>
          </select></label
        ><label
          >Resident pose
          <select id="resident-pose">
            <option value="walk" selected>Walk</option>
            <option value="cheer">Cheer</option>
            <option value="flee">Fear</option>
            <option value="sad">Mourning</option>
            <option value="defeat">Defeat</option>
          </select></label
        ><label
          >Monster pose
          <select id="monster-pose">
            <option value="idle" selected>Idle</option>
            <option value="attack">Attack</option>
            <option value="stagger">Stagger</option>
          </select></label
        ><label
          >Distance
          <select id="distance">
            <option>600</option>
            <option selected>1200</option>
            <option>3000</option>
          </select></label
        ><label
          >Time
          <select id="hour">
            <option value="6">Sunrise</option>
            <option value="14" selected>Midday</option>
            <option value="17.8">Sunset</option>
            <option value="18.5">Twilight</option>
            <option value="0">Midnight</option>
          </select></label
        ><label
          >Altitude
          <select id="altitude">
            <option value="120">Overview</option>
            <option value="12">Ground</option>
            <option value="1200">High</option>
          </select></label
        ><label
          >Quality
          <select id="inspect-quality">
            <option value="auto">Auto</option>
            <option value="720">Performance</option>
            <option value="1080">High</option>
            <option value="1440">Ultra</option>
          </select></label
        >
        <label><input id="inspect-photo" type="checkbox" />Photo</label>
        <label
          >Focus (m)
          <input
            id="inspect-focus"
            type="number"
            min="0"
            max="1200"
            value="120"
            size="5"
        /></label>
        <label
          >Exposure
          <input
            id="inspect-exposure"
            type="number"
            min="0.4"
            max="2.2"
            step="0.1"
            value="1.15"
            size="4"
        /></label>
        <button id="inspect-impact">Material impacts</button>
        <button id="inspect-crash">Crash plume</button>
        <button id="inspect-collapse">Collapse dust</button>
        <button id="inspect-water">Water splash</button>
        <button id="inspect-water-laser">Laser over river</button>
        <button id="inspect-nuke">Nuke at view</button>
        <button id="restore-view">Restore test world</button>
        <button id="tour">Play inspection</button
        ><button id="pause-tour">Pause inspection</button>
      </details>
      <details>
        <summary>Raw timings</summary>
        <pre id="report"></pre>
      </details>
    </aside>
    <script type="module" src="/src/performance-benchmark.ts"></script>
  </body>
</html>
